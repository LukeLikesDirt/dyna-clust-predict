# sync-to-siblings.yml — On push to main, propose the manifest-listed shared
# files (tools/sync_manifest.tsv) into the dataset-specific sibling repos
# (dyna-clust-predict-am, dyna-clust-predict-ecm) as a pull request.
#
# Deliberately opens a PR rather than pushing directly: a change that is
# correct for the general eukaryote pipeline can still be wrong for AM's
# Glomeromycota-only subset or ECM's ectomycorrhizal subset, and the PR is
# where a human catches that before it lands.
#
# Direction is one-way (main -> siblings). A fix that originates in a
# sibling (e.g. ECM's future.globals.maxSize raise) is a manual PR into main,
# not something this workflow handles.
#
# Requires a repository secret SIBLING_REPOS_PAT: a GitHub personal access
# token with write access (repo scope, or fine-grained contents+PR write) to
# both LukeLikesDirt/dyna-clust-predict-am and LukeLikesDirt/dyna-clust-predict-ecm.
# Create it at github.com/settings/tokens, then add it under this repo's
# Settings -> Secrets and variables -> Actions. Nothing in this workflow can
# create that secret for you -- until it exists, every run fails at the
# sibling checkout step with an auth error, and nothing is synced.

name: Sync to sibling repos

on:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "tests/**"
      - "tools/sync_manifest.tsv"

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [am, ecm]
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout dyna-clust-predict-${{ matrix.target }}
        uses: actions/checkout@v4
        with:
          repository: LukeLikesDirt/dyna-clust-predict-${{ matrix.target }}
          token: ${{ secrets.SIBLING_REPOS_PAT }}
          path: sibling

      - name: Sync manifest-listed files
        working-directory: main
        run: bash tools/sync_to_sibling.sh ${{ matrix.target }} ../sibling

      - name: Check for changes
        id: changes
        working-directory: sibling
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No drift -- dyna-clust-predict-${{ matrix.target }} already matches main's manifest-listed files."
          fi

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: sibling
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_PAT }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          branch="sync-from-main-${short_sha}"
          source_subject=$(cd ../main && git log -1 --format=%s)
          source_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A

          commit_msg=$(printf 'sync: pull in shared-file changes from main\n\nSource: %s\n%s\n\nAuto-generated by dyna-clust-predict'"'"'s sync-to-siblings workflow.\nReview before merging -- a change correct for the general pipeline\ncan still be wrong for this dataset'"'"'s subset.R/check_annotations.R\nor other dataset-specific behaviour.\n' "$source_url" "$source_subject")
          git commit -m "$commit_msg"
          git push -u origin "$branch"

          pr_body=$(printf 'Automated sync from [dyna-clust-predict@%s](%s):\n\n> %s\n\nOnly files listed in `tools/sync_manifest.tsv` are touched. Review the diff -- this is proposed, not applied automatically, because a change correct for the general eukaryote pipeline can still be wrong for this dataset.\n' "$short_sha" "$source_url" "$source_subject")

          gh pr create \
            --repo "LukeLikesDirt/dyna-clust-predict-${{ matrix.target }}" \
            --head "$branch" \
            --base main \
            --title "sync: pull in shared-file changes from main (${short_sha})" \
            --body "$pr_body"
